language: java
dist: trusty
jdk:
  - openjdk11

env:
  global:
    JAVA_OPTS=-Xmx4g

cache:
  directories:
    - "$HOME/.m2"
before_cache:
  - rm -rf $HOME/.m2/repository/org/apache/logging/log4j

before_install:
  - wget --output-document=jdk.tar.gz https://download.java.net/java/GA/jdk11/9/GPL/openjdk-11.0.2_linux-x64_bin.tar.gz
  - mkdir -p /home/travis/openjdk11
  - tar --extract --file jdk.tar.gz -C /home/travis/openjdk11 --strip-components=1

install:
  - jdk_switcher use openjdk8
  - mvn -t .travis-toolchains.xml install -DskipTests=true -Dmaven.javadoc.skip=true -B -V

script:
  - jdk_switcher use openjdk8
  - mvn -t .travis-toolchains.xml test -B -V

after_success:
  - jdk_switcher use openjdk8
  - mvn -t .travis-toolchains.xml -pl !log4j-bom jacoco:prepare-agent test jacoco:report coveralls:report -B -V
